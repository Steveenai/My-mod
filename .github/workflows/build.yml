name: Build Emperor Eye Revemp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Extract project
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP trouvé."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          mkdir -p project
          unzip -q "$ZIP" -d project

          BUILD=$(find project -path "*/EmperorEyeRevemp-0.1/build.gradle" -type f | head -n 1)

          if [ -z "$BUILD" ]; then
            echo "ERREUR : build.gradle introuvable."
            find project -name "build.gradle" -print
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD")

          echo "Projet trouvé : $PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== CONTENU DU PROJET ==="
          ls -la "$PROJECT_DIR"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Fix build.gradle
        run: |
          set -e

          echo "=== build.gradle AVANT correction ==="
          nl -ba "$PROJECT_DIR/build.gradle" | sed -n '1,80p'

          # Supprime le bloc publishing qui provoque
          # l'erreur "Cannot invoke method repositories() on null object"
          sed -i '/^[[:space:]]*publishing[[:space:]]*{/d' "$PROJECT_DIR/build.gradle"

          echo "=== build.gradle APRÈS correction ==="
          nl -ba "$PROJECT_DIR/build.gradle" | sed -n '1,80p'

      - name: Build JAR
        run: |
          set -e

          cd "$PROJECT_DIR"

          ./gradlew build --no-daemon --stacktrace

      - name: Show build outputs
        if: always()
        run: |
          echo "================================"
          echo "PROJECT_DIR"
         
