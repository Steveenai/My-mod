name: Build Emperor Eye Revemp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Check project files
        run: |
          echo "=== Fichiers du projet ==="
          ls -la
          echo "=== build.gradle ==="
          ls -l build.gradle settings.gradle 2>/dev/null || true

      - name: Build Emperor Eye Revemp
        run: gradle build --no-daemon --stacktrace

      - name: Upload Emperor Eye Revemp JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: emperor-eye-revemp
          path: build/libs/*.jar
          if-no-files-found: error
