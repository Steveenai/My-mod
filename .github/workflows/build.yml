name: Build Emperor Eye Revemp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Extract project
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP trouvé à la racine."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP"

          mkdir -p project
          unzip -q "$ZIP" -d project

          PROJECT_DIR="project/EmperorEyeRevemp-0.1"

          if [ ! -f "$PROJECT_DIR/build.gradle" ]; then
            echo "ERREUR : build.gradle introuvable dans $PROJECT_DIR"
            echo "Contenu trouvé :"
            find project -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "Projet trouvé : $PROJECT_DIR"

          echo "=== Contenu du projet ==="
          ls -la "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build JAR
        run: |
          cd "$PROJECT_DIR"
          ./gradlew build --no-daemon --stacktrace

      - name: Show build outputs
        if: always()
        run: |
          echo "=== PROJECT_DIR ==="
          echo "$PROJECT_DIR"

          echo "=== BUILD/LIBS ==="
          if [ -d "$PROJECT_DIR/build/libs" ]; then
            ls -lah "$PROJECT_DIR/build/libs"
          else
            echo "build/libs n'existe pas."
          fi

          echo "=== TOUS LES JAR ==="
          find "$PROJECT_DIR" -type f -name "*.jar" -print || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EmperorEyeRevemp-JAR
          path: "${{ env.PROJECT_DIR }}/build/libs/*.jar"
          if-no-files-found: error
