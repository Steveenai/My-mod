name: Build Serpent Addon

"on":
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Extract addon ZIP
        run: |
          unzip -q KimetsuCraft_Serpent_Beta5_GitHub_Ready.zip
          cd KimetsuCraft_Serpent_Beta5
          gradle build --no-daemon

      - name: Upload addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: serpent-addon
          path: KimetsuCraft_Serpent_Beta5/build/libs/*.jar
