name: Build Emperor Eye Revemp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERREUR : aucun ZIP trouvé."
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

          BUILD=$(find project -name "build.gradle" -type f | head -n 1)

          if [ -z "$BUILD" ]; then
            echo "ERREUR : build.gradle introuvable."
            exit 1
          fi

          echo "build.gradle trouvé : $BUILD"

      - name: Find Gradle project
        run: |
          BUILD=$(find project -name "build.gradle" -type f | head -n 1)
          PROJECT_DIR=$(dirname "$BUILD")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build JAR
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon --stacktrace

      -       - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: emperor-eye-revemp
          path: "${{ env.PROJECT_DIR }}/build/libs/*.jar"
          if-no-files-found: error
