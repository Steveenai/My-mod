name: Build Serpent Addon

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          echo "ZIP trouvé : $ZIP"
          unzip -q "$ZIP" -d extracted

      - name: Find Gradle project
        run: |
          PROJECT=$(find extracted -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT")
          echo "Projet trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: serpent-addon
          path: "${{ env.PROJECT_DIR }}/build/libs/*.jar"
