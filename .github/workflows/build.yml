name: Build Emperor Eye Revemp

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.8"

      - name: Find Gradle project
        run: |
          echo "Recherche de build.gradle..."
          PROJECT=$(find . -name "build.gradle" -type f | head -n 1)

          if [ -z "$PROJECT" ]; then
            echo "ERREUR : build.gradle introuvable."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Projet trouvé : $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build Emperor Eye Revemp
        run: |
          cd "$PROJECT_DIR"
          gradle build --no-daemon --stacktrace

      - name: Upload Emperor Eye Revemp JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: emperor-eye-revemp
          path: "${{ env.PROJECT_DIR }}/build/libs/*.jar"
          if-no-files-found: error
